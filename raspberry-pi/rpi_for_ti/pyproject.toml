[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hball-ti-vision"
version = "1.0.0"
description = "Raspberry Pi tube-relative steel-ball vision for TI MSPM0G3507"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pyserial>=3.5",
]

[project.scripts]
hball-ti = "hball_ti.main:main"

[tool.setuptools.packages.find]
where = ["src"]
